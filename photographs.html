<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Photographs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #e8e6e1;
      color: #222;
      font-family: 'Courier New', Courier, monospace;
    }

    .gallery {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      /* Più spazio in basso per i pulsanti, meno in alto */
      padding: 30px 20px 110px;
    }

    .slide.active {
      display: flex;
    }

    .polaroid {
      background: #fff;
      padding: 14px 14px 55px 14px;
      width: min(400px, 78vw);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14), 0 4px 14px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .polaroid:active {
      transform: scale(0.98);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: contain;
      filter: sepia(6%) contrast(102%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .slide.active .polaroid img {
      opacity: 1;
    }

    /* Blocco pulsanti unico al centro in basso */
    .nav-cluster {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 32px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .ps-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .ps-btn:active {
      transform: scale(0.86);
    }

    .ps-btn svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
      stroke-width: 2.6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Su: verdino chiaro */
    .ps-btn.up {
      background: rgba(180, 220, 180, 0.35);
    }

    .ps-btn.up:hover {
      background: rgba(180, 220, 180, 0.5);
    }

    /* Giù: azzurrino chiaro */
    .ps-btn.down {
      background: rgba(200, 220, 245, 0.45);
    }

    .ps-btn.down:hover {
      background: rgba(200, 220, 245, 0.6);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    @media (max-width: 600px) {
      .slide { padding: 20px 16px 100px; }
      .polaroid { padding: 10px 10px 40px 10px; }
      .nav-cluster { padding: 8px 10px; bottom: 12px; }
      .ps-btn { width: 40px; height: 40px; }
      .ps-btn svg { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>

  <main class="gallery">
    <div class="slide" data-src="photographs/foto-02.jpg"><div class="polaroid"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1"></div></div>
    <div class="slide" data-src="photographs/foto-10.jpg"><div class="polaroid"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-13.jpg"><div class="polaroid"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-14.jpg"><div class="polaroid"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-15.jpg"><div class="polaroid"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-16.jpg"><div class="polaroid"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-22.jpg"><div class="polaroid"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-23.jpg"><div class="polaroid"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-27.jpg"><div class="polaroid"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-29.jpg"><div class="polaroid"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-30.jpg"><div class="polaroid"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11" loading="lazy"></div></div>
    <div class="slide" data-src="photographs/foto-31.jpg"><div class="polaroid"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12" loading="lazy"></div></div>
  </main>

  <div class="nav-cluster">
    <button class="ps-btn up" id="btnPrev" aria-label="Foto precedente">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="ps-btn down" id="btnNext" aria-label="Foto successiva">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="close-btn" id="closeBtn" aria-label="Chiudi">×</button>
    <img src="" alt="" id="lightboxImg">
  </div>

  <script>
    const gallery = document.querySelector('.gallery');
    const slides = Array.from(gallery.querySelectorAll('.slide'));

    // Shuffle
    slides.sort(() => Math.random() - 0.5);
    const fragment = document.createDocumentFragment();
    slides.forEach(s => fragment.appendChild(s));
    gallery.appendChild(fragment);

    let current = 0;
    const total = slides.length;

    function showSlide(index) {
      slides.forEach((s, i) => s.classList.toggle('active', i === index));
      current = index;
    }

    function nextSlide() {
      current = (current + 1) % total;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + total) % total;
      showSlide(current);
    }

    // Prima foto visibile subito
    showSlide(0);
    const firstImg = slides[0].querySelector('img');
    if (firstImg) {
      firstImg.loading = 'eager';
      firstImg.fetchPriority = 'high';
    }

    // Pulsanti
    document.getElementById('btnPrev').addEventListener('click', prevSlide);
    document.getElementById('btnNext').addEventListener('click', nextSlide);

    // Tastiera
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') prevSlide();
      if (e.key === 'ArrowDown') nextSlide();
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('closeBtn');

    slides.forEach(slide => {
      const polaroid = slide.querySelector('.polaroid');
      polaroid.addEventListener('click', () => {
        const src = slide.dataset.src;
        lightboxImg.src = src;
        lightboxImg.alt = polaroid.querySelector('img').alt;
        lightbox.classList.add('open');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    closeBtn.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });

    // Blocca ogni scroll/gesto touch
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
  </script>

</body>
</html>
