<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: none;
    }

    body {
      background: #e8e6e1;
      color: #222;
      font-family: 'Courier New', Courier, monospace;
      overflow-y: scroll;
    }

    .gallery {
      width: 100%;
    }

    .slide {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .polaroid {
      background: #fff;
      padding: 14px 14px 55px 14px;
      width: min(420px, 80vw);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14), 0 4px 14px rgba(0,0,0,0.1);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 68vh;
      max-height: 68dvh;
      object-fit: contain;
      filter: sepia(6%) contrast(102%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Prima foto: visibile subito */
    .slide:first-child .polaroid img {
      opacity: 1;
      transition: none;
    }

    /* Fade-in quando entra in viewport */
    .slide.visible .polaroid img {
      opacity: 1;
    }
  </style>
</head>
<body>

  <main class="gallery">
    <div class="slide"><div class="polaroid"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11" loading="lazy"></div></div>
    <div class="slide"><div class="polaroid"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12" loading="lazy"></div></div>
  </main>

  <script>
    const gallery = document.querySelector('.gallery');
    const slides = Array.from(gallery.querySelectorAll('.slide'));

    // Shuffle
    slides.sort(() => Math.random() - 0.5);
    const fragment = document.createDocumentFragment();
    slides.forEach(s => fragment.appendChild(s));
    gallery.appendChild(fragment);

    // Prima foto: carica subito
    const firstImg = slides[0].querySelector('img');
    if (firstImg) {
      firstImg.loading = 'eager';
      firstImg.fetchPriority = 'high';
    }

    // Fade-in progressivo
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '50px 0px' });

    slides.forEach((slide, index) => {
      if (index !== 0) observer.observe(slide);
    });
  </script>

</body>
</html>
