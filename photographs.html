<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Photographs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #e8e6e1;
      color: #222;
      font-family: "Libre Baskerville", Georgia, "Times New Roman", serif;
    }

    .gallery {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px 100px;
      visibility: hidden;
      opacity: 0;
      contain: strict;
      content-visibility: auto;
    }

    .slide.active {
      visibility: visible;
      opacity: 1;
      content-visibility: visible;
      z-index: 1;
    }

    .polaroid {
      background: #fff;
      padding: 14px 14px 55px 14px;
      width: min(400px, 78vw);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14), 0 4px 14px rgba(0,0,0,0.1);
      cursor: pointer;
      transform: translateZ(0);
      will-change: transform;
    }

    .polaroid:active {
      transform: scale(0.97) translateZ(0);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: contain;
      opacity: 1;
      transform: translateZ(0);
      backface-visibility: hidden;
      pointer-events: none;
    }

    /* Loader */
    .loader {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
      background: #e8e6e1;
    }

    .loader.active {
      display: flex;
    }

    .loader-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8a8580;
      opacity: 0.25;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Tasto refresh */
    .refresh-btn {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.35) 0%, rgba(200, 220, 245, 0.45) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.3s ease;
      z-index: 100;
      will-change: transform;
      opacity: 0;
    }

    .refresh-btn.visible {
      display: flex;
      opacity: 1;
    }

    .refresh-btn:hover {
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.5) 0%, rgba(200, 220, 245, 0.6) 100%);
    }

    .refresh-btn:active {
      transform: translateX(-50%) scale(0.88);
    }

    .refresh-btn.loading {
      opacity: 0;
      pointer-events: none;
    }

    .refresh-btn svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      display: none;
      z-index: 1000;
      overflow: hidden;
    }

    .lightbox.open {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open.explore {
      display: block;
      overflow: auto;
      padding: 0;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
    }

    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      margin: 0 auto;
      transform: translateZ(0);
    }

    .lightbox.explore img {
      max-width: none;
      max-height: none;
      width: 220vw;
      height: auto;
      margin: 0;
      cursor: grab;
    }

    /* Tasto Play */
    .play-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 78px;
      height: 34px;
      border-radius: 17px;
      border: 2px solid rgba(255,255,255,0.5);
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.35) 0%, rgba(200, 220, 245, 0.45) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      z-index: 1001;
    }

    .lightbox.open .play-btn {
      display: flex;
    }

    .lightbox.open.explore .play-btn {
      display: none;
    }

    .play-btn:hover {
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.5) 0%, rgba(200, 220, 245, 0.6) 100%);
    }

    .play-btn:active {
      transform: translateX(-50%) scale(0.94);
    }

    .play-btn svg {
      width: 14px;
      height: 14px;
      margin-left: 2px;
    }

    @media (max-width: 600px) {
      .slide { padding: 20px 16px 90px; }
      .polaroid { padding: 10px 10px 40px 10px; }
      .refresh-btn { width: 46px; height: 46px; bottom: 16px; }
      .refresh-btn svg { width: 20px; height: 20px; }
      .play-btn { width: 70px; height: 30px; border-radius: 15px; bottom: 20px; }
      .play-btn svg { width: 12px; height: 12px; }
      .loader-dot { width: 8px; height: 8px; }
    }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>

  <main class="gallery">
    <div class="slide" data-src="photographs/foto-02.jpg"><div class="polaroid"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-10.jpg"><div class="polaroid"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-13.jpg"><div class="polaroid"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-14.jpg"><div class="polaroid"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-15.jpg"><div class="polaroid"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-16.jpg"><div class="polaroid"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-22.jpg"><div class="polaroid"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-23.jpg"><div class="polaroid"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-27.jpg"><div class="polaroid"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-29.jpg"><div class="polaroid"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-30.jpg"><div class="polaroid"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-31.jpg"><div class="polaroid"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12" decoding="async"></div></div>
  </main>

  <button class="refresh-btn" id="refreshBtn" aria-label="Altra foto">
    <svg viewBox="0 0 24 24">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
  </button>

  <div class="lightbox" id="lightbox">
    <img src="" alt="" id="lightboxImg" decoding="async">
    <button class="play-btn" id="playBtn" aria-label="Esplora">
      <svg viewBox="0 0 24 24" width="14" height="14">
        <polygon points="6,3 21,12 6,21" fill="#fff"/>
      </svg>
    </button>
  </div>

  <script>
    const gallery = document.querySelector('.gallery');
    const slides = Array.from(gallery.querySelectorAll('.slide'));
    const refreshBtn = document.getElementById('refreshBtn');
    const loader = document.getElementById('loader');
    const total = slides.length;
    const MIN_LOADER_MS = 800;

    async function ensureReady(img) {
      if (!img.complete) {
        await new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }
      try { await img.decode(); } catch(e) {}
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let viewOrder = shuffle([...Array(total).keys()]);
    let currentPos = 0;
    let isLoading = false;

    function hideAll() {
      slides.forEach(s => s.classList.remove('active'));
    }

    function showSlide(index) {
      slides[index].classList.add('active');
    }

    function showRefresh() {
      refreshBtn.classList.add('visible');
    }

    function hideRefresh() {
      refreshBtn.classList.remove('visible');
    }

    async function waitMinTime(startTime) {
      const elapsed = Date.now() - startTime;
      if (elapsed < MIN_LOADER_MS) {
        await new Promise(r => setTimeout(r, MIN_LOADER_MS - elapsed));
      }
    }

    async function init() {
      hideRefresh();
      loader.classList.add('active');
      const loaderStart = Date.now();

      await new Promise(r => requestAnimationFrame(r));
      await new Promise(r => requestAnimationFrame(r));

      const firstSlide = slides[viewOrder[0]];
      const firstImg = firstSlide.querySelector('img');
      firstImg.fetchPriority = 'high';
      
      await ensureReady(firstImg);
      await waitMinTime(loaderStart);

      loader.classList.remove('active');
      showSlide(viewOrder[0]);
      showRefresh();

      requestAnimationFrame(() => {
        setTimeout(() => {
          slides.forEach((s, i) => {
            if (i !== viewOrder[0]) ensureReady(s.querySelector('img'));
          });
        }, 50);
      });
    }

    async function refresh() {
      if (isLoading) return;
      isLoading = true;
      hideRefresh();
      loader.classList.add('active');
      const loaderStart = Date.now();

      await new Promise(r => requestAnimationFrame(r));
      await new Promise(r => requestAnimationFrame(r));

      currentPos++;
      if (currentPos >= total) {
        viewOrder = shuffle([...Array(total).keys()]);
        currentPos = 0;
      }

      const targetSlide = slides[viewOrder[currentPos]];
      const targetImg = targetSlide.querySelector('img');

      await ensureReady(targetImg);
      await waitMinTime(loaderStart);

      hideAll();
      loader.classList.remove('active');
      showSlide(viewOrder[currentPos]);
      showRefresh();

      isLoading = false;
    }

    init();

    refreshBtn.addEventListener('click', refresh);

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const playBtn = document.getElementById('playBtn');
    let historyDepth = 0;

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('open');
      history.pushState({ lightbox: true }, '');
      historyDepth = 1;
    }

    function enterExplore() {
      lightbox.classList.add('explore');
      history.pushState({ lightbox: true, explore: true }, '');
      historyDepth = 2;
      requestAnimationFrame(() => {
        lightbox.scrollLeft = (lightboxImg.scrollWidth - lightbox.clientWidth) / 2;
        lightbox.scrollTop = (lightboxImg.scrollHeight - lightbox.clientHeight) / 2;
      });
    }

    function exitExplore() {
      lightbox.classList.remove('explore');
      lightbox.scrollLeft = 0;
      lightbox.scrollTop = 0;
      historyDepth = 1;
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.classList.remove('explore');
      lightboxImg.src = '';
      lightbox.scrollLeft = 0;
      lightbox.scrollTop = 0;
      historyDepth = 0;
    }

    window.addEventListener('popstate', () => {
      if (historyDepth === 2) exitExplore();
      else if (historyDepth === 1) closeLightbox();
    });

    slides.forEach(slide => {
      slide.querySelector('.polaroid').addEventListener('click', () => {
        openLightbox(slide.dataset.src, slide.querySelector('img').alt);
      });
    });

    playBtn.addEventListener('click', enterExplore);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && historyDepth > 0) {
        const depth = historyDepth;
        closeLightbox();
        if (depth > 0) history.go(-depth);
      }
    });

    document.addEventListener('touchmove', (e) => {
      if (lightbox.classList.contains('open') && lightbox.classList.contains('explore')) return;
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('wheel', (e) => {
      if (lightbox.classList.contains('open') && lightbox.classList.contains('explore')) return;
      e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
  </script>

</body>
</html>
