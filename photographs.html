<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: none;
    }

    body {
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
      overflow-y: scroll;
    }

    .gallery {
      width: 100%;
    }

    .photo-section {
      width: 100%;
      height: 100vh;
      height: 100dvh; /* compatibile con mobile */
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      contain: layout style;
    }

    .photo-section img {
      display: block;
      max-width: 90vw;
      max-height: 85vh;
      max-height: 85dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      /* Solo opacity, zero transform → zero movimento */
      opacity: 0;
      transition: opacity 0.25s ease-out;
    }

    /* Prima foto: visibile immediatamente, nessuna transizione */
    .photo-section:first-child img {
      opacity: 1;
      transition: none;
    }

    /* Le altre: semplice fade, nessuno spostamento */
    .photo-section.visible img {
      opacity: 1;
    }
  </style>
</head>
<body>

 <main class="gallery">
  <div class="photo-section"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1"></div>
  <div class="photo-section"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11" loading="lazy"></div>
  <div class="photo-section"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12" loading="lazy"></div>
 </main>

<script>
  const gallery = document.querySelector('.gallery');
  const sections = Array.from(gallery.querySelectorAll('.photo-section'));
  
  // Shuffle efficiente
  sections.sort(() => Math.random() - 0.5);
  const fragment = document.createDocumentFragment();
  sections.forEach(sec => fragment.appendChild(sec));
  gallery.appendChild(fragment);

  // Prima foto: priorità alta
  const firstImg = sections[0].querySelector('img');
  if (firstImg) {
    firstImg.loading = 'eager';
    firstImg.fetchPriority = 'high';
  }

  // Observer minimale: solo fade, nessun transform
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, {
    threshold: 0.1,
    rootMargin: '50px 0px'
  });

  sections.forEach((sec, index) => {
    if (index !== 0) observer.observe(sec);
  });
</script>

</body>
</html>
