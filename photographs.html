<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Photographs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #e8e6e1;
      color: #222;
      font-family: 'Courier New', Courier, monospace;
    }

    .gallery {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px 20px 100px;
      contain: paint layout;
    }

    .slide.active {
      display: flex;
    }

    .polaroid {
      background: #fff;
      padding: 14px 14px 55px 14px;
      width: min(400px, 78vw);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14), 0 4px 14px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.15s ease;
      will-change: transform;
    }

    .polaroid:active {
      transform: scale(0.97);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: contain;
      filter: sepia(6%) contrast(102%);
      opacity: 0;
      transform: translateZ(0);
      transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backface-visibility: hidden;
      pointer-events: none;
    }

    .slide.active .polaroid img {
      opacity: 1;
    }

    /* Tasto refresh */
    .refresh-btn {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.35) 0%, rgba(200, 220, 245, 0.45) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
      z-index: 100;
      will-change: transform;
    }

    .refresh-btn:hover {
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.5) 0%, rgba(200, 220, 245, 0.6) 100%);
    }

    .refresh-btn:active {
      transform: translateX(-50%) scale(0.88);
    }

    .refresh-btn svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      display: none;
      z-index: 1000;
      overflow: hidden;
    }

    .lightbox.open {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open.explore {
      display: block;
      overflow: auto;
      padding: 0;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
    }

    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      margin: 0 auto;
      transform: translateZ(0);
    }

    .lightbox.explore img {
      max-width: none;
      max-height: none;
      width: 220vw;
      height: auto;
      margin: 0;
      cursor: grab;
    }

    /* Tasto Play */
    .play-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 78px;
      height: 34px;
      border-radius: 17px;
      border: 2px solid rgba(255,255,255,0.5);
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.35) 0%, rgba(200, 220, 245, 0.45) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      z-index: 1001;
    }

    .lightbox.open .play-btn {
      display: flex;
    }

    .lightbox.open.explore .play-btn {
      display: none;
    }

    .play-btn:hover {
      background: linear-gradient(180deg, rgba(180, 220, 180, 0.5) 0%, rgba(200, 220, 245, 0.6) 100%);
    }

    .play-btn:active {
      transform: translateX(-50%) scale(0.94);
    }

    .play-btn svg {
      width: 14px;
      height: 14px;
      margin-left: 2px;
    }

    @media (max-width: 600px) {
      .slide { padding: 20px 16px 90px; }
      .polaroid { padding: 10px 10px 40px 10px; }
      .refresh-btn { width: 46px; height: 46px; bottom: 16px; }
      .refresh-btn svg { width: 20px; height: 20px; }
      .play-btn { width: 70px; height: 30px; border-radius: 15px; bottom: 20px; }
      .play-btn svg { width: 12px; height: 12px; }
    }
  </style>
</head>
<body>

  <main class="gallery">
    <div class="slide" data-src="photographs/foto-02.jpg"><div class="polaroid"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-10.jpg"><div class="polaroid"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-13.jpg"><div class="polaroid"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-14.jpg"><div class="polaroid"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-15.jpg"><div class="polaroid"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-16.jpg"><div class="polaroid"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-22.jpg"><div class="polaroid"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-23.jpg"><div class="polaroid"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-27.jpg"><div class="polaroid"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-29.jpg"><div class="polaroid"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-30.jpg"><div class="polaroid"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11" decoding="async"></div></div>
    <div class="slide" data-src="photographs/foto-31.jpg"><div class="polaroid"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12" decoding="async"></div></div>
  </main>

  <button class="refresh-btn" id="refreshBtn" aria-label="Altra foto">
    <svg viewBox="0 0 24 24">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
  </button>

  <div class="lightbox" id="lightbox">
    <img src="" alt="" id="lightboxImg" decoding="async">
    <button class="play-btn" id="playBtn" aria-label="Esplora">
      <svg viewBox="0 0 24 24" width="14" height="14">
        <polygon points="6,3 21,12 6,21" fill="#fff"/>
      </svg>
    </button>
  </div>

  <script>
    const gallery = document.querySelector('.gallery');
    const slides = Array.from(gallery.querySelectorAll('.slide'));
    const total = slides.length;
    const preloaded = new Set();

    // Precarica un'immagine in background
    function preload(src) {
      if (preloaded.has(src)) return;
      const img = new Image();
      img.src = src;
      preloaded.add(src);
    }

    // Fisher-Yates shuffle
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let viewOrder = shuffle([...Array(total).keys()]);
    let currentPos = 0;

    function showSlideByViewPos(pos) {
      const slideIndex = viewOrder[pos];
      slides.forEach((s, i) => s.classList.toggle('active', i === slideIndex));
      // Precarica la prossima immagine in anticipo
      const nextPos = (pos + 1) % total;
      const nextSrc = slides[viewOrder[nextPos]].dataset.src;
      preload(nextSrc);
    }

    function refresh() {
      currentPos++;
      if (currentPos >= total) {
        viewOrder = shuffle([...Array(total).keys()]);
        currentPos = 0;
      }
      showSlideByViewPos(currentPos);
    }

    // Inizializza
    showSlideByViewPos(0);

    // Precarica tutte le immagini subito dopo il primo paint
    requestAnimationFrame(() => {
      setTimeout(() => {
        slides.forEach(s => preload(s.dataset.src));
      }, 50);
    });

    document.getElementById('refreshBtn').addEventListener('click', refresh);

    // Lightbox + History API
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const playBtn = document.getElementById('playBtn');
    let historyDepth = 0;

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('open');
      history.pushState({ lightbox: true }, '');
      historyDepth = 1;
    }

    function enterExplore() {
      lightbox.classList.add('explore');
      history.pushState({ lightbox: true, explore: true }, '');
      historyDepth = 2;
      requestAnimationFrame(() => {
        lightbox.scrollLeft = (lightboxImg.scrollWidth - lightbox.clientWidth) / 2;
        lightbox.scrollTop = (lightboxImg.scrollHeight - lightbox.clientHeight) / 2;
      });
    }

    function exitExplore() {
      lightbox.classList.remove('explore');
      lightbox.scrollLeft = 0;
      lightbox.scrollTop = 0;
      historyDepth = 1;
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.classList.remove('explore');
      lightboxImg.src = '';
      lightbox.scrollLeft = 0;
      lightbox.scrollTop = 0;
      historyDepth = 0;
    }

    window.addEventListener('popstate', () => {
      if (historyDepth === 2) exitExplore();
      else if (historyDepth === 1) closeLightbox();
    });

    slides.forEach(slide => {
      slide.querySelector('.polaroid').addEventListener('click', () => {
        openLightbox(slide.dataset.src, slide.querySelector('img').alt);
      });
    });

    playBtn.addEventListener('click', enterExplore);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && historyDepth > 0) {
        const depth = historyDepth;
        closeLightbox();
        if (depth > 0) history.go(-depth);
      }
    });

    // Blocca scroll/gesto touch
    document.addEventListener('touchmove', (e) => {
      if (lightbox.classList.contains('open') && lightbox.classList.contains('explore')) return;
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('wheel', (e) => {
      if (lightbox.classList.contains('open') && lightbox.classList.contains('explore')) return;
      e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
  </script>

</body>
</html>
