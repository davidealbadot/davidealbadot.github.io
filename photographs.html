    <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographs</title>

  <style>
   html {
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #fff;
}

.gallery {
  width: 100%;
}

.photo {
  width: 100%;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  scroll-snap-align: start;
}

.photo img {
  display: block;
  max-width: 90vw;
  max-height: 88vh;
  width: auto;
  height: auto;

  opacity: 0;
  transform: translateY(12px);
  animation: appear 0.8s ease forwards;
}

@keyframes appear {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  </style>

</head>
<body>

   <main class="gallery">

    <div class="photo">
      <img src="photographs/foto-02.jpg" alt="Foto 1">
    </div>

    <div class="photo">
      <img src="photographs/foto-10.jpg" alt="Foto 2">
    </div>

    <div class="photo">
      <img src="photographs/foto-13.jpg" alt="Foto 3">
    </div>

    <div class="photo">
      <img src="photographs/foto-14.jpg" alt="Foto 4">
    </div>

    <div class="photo">
      <img src="photographs/foto-15.jpg" alt="Foto 5">
    </div>

    <div class="photo">
      <img src="photographs/foto-16.jpg" alt="Foto 6">
    </div>

    <div class="photo">
      <img src="photographs/foto-22.jpg" alt="Foto 7">
    </div>

    <div class="photo">
      <img src="photographs/foto-23.jpg" alt="Foto 8">
    </div>

    <div class="photo">
      <img src="photographs/foto-27.jpg" alt="Foto 9">
    </div>

    <div class="photo">
      <img src="photographs/foto-29.jpg" alt="Foto 10">
    </div>

     <div class="photo">
      <img src="photographs/foto-30.jpg" alt="Foto 11">
    </div>

     <div class="photo">
      <img src="photographs/foto-31.jpg" alt="Foto 12">
    </div>

     
 </main>

<script>
  const gallery = document.querySelector('.gallery');
  const images = Array.from(gallery.querySelectorAll('img'));

  images.sort(() => Math.random() - 0.5);

  images.forEach(img => gallery.appendChild(img));
</script>
  
</body>
</html>
