<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: none;
    }

    html.zooming {
      scroll-snap-type: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-y: scroll;
    }

    .gallery {
      width: 100%;
    }

    .slide {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .photo-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-frame img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.3s ease;
      cursor: zoom-in;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Prima foto: visibile immediatamente */
    .slide:first-child .photo-frame img {
      opacity: 1;
      transition: none;
    }

    /* Fade-in quando la slide entra in viewport */
    .slide.visible .photo-frame img {
      opacity: 1;
    }

    /* Stato zoomato: scrollabile per navigare l'immagine */
    .slide.zoomed .photo-frame {
      overflow: auto;
      align-items: flex-start;
      justify-content: flex-start;
      cursor: grab;
    }

    .slide.zoomed .photo-frame img {
      max-width: none;
      max-height: none;
      cursor: grab;
    }
  </style>

</head>
<body>

 <main class="gallery">
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11" loading="lazy"></div></div>
  <div class="slide"><div class="photo-frame"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12" loading="lazy"></div></div>
 </main>

<script>
  const gallery = document.querySelector('.gallery');
  const slides = Array.from(gallery.querySelectorAll('.slide'));

  // Shuffle efficiente
  slides.sort(() => Math.random() - 0.5);
  const fragment = document.createDocumentFragment();
  slides.forEach(s => fragment.appendChild(s));
  gallery.appendChild(fragment);

  // Prima foto: carica subito
  const firstImg = slides[0].querySelector('img');
  if (firstImg) {
    firstImg.loading = 'eager';
    firstImg.fetchPriority = 'high';
  }

  // Fade-in progressivo
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, {
    threshold: 0.1,
    rootMargin: '50px 0px'
  });

  slides.forEach((slide, index) => {
    if (index !== 0) observer.observe(slide);
  });

  // Zoom: click per ingrandire, click per tornare indietro
  slides.forEach(slide => {
    const frame = slide.querySelector('.photo-frame');
    const img = frame.querySelector('img');

    frame.addEventListener('click', () => {
      const isZoomed = slide.classList.toggle('zoomed');

      if (isZoomed) {
        // Disabilita lo scroll-snap della pagina mentre si naviga la foto zoomata
        document.documentElement.classList.add('zooming');
        // Centra lo scroll sull'immagine
        requestAnimationFrame(() => {
          frame.scrollLeft = (img.scrollWidth - frame.clientWidth) / 2;
          frame.scrollTop = (img.scrollHeight - frame.clientHeight) / 2;
        });
      } else {
        document.documentElement.classList.remove('zooming');
      }
    });
  });
</script>

</body>
</html>
