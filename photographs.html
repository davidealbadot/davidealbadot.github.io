<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-y: scroll;
    }

    .gallery {
      width: 100%;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;          /* riempie tutto lo schermo */
      scroll-snap-align: start;
      scroll-snap-stop: always;
      opacity: 0;
      transition: opacity 0.35s ease-out;
    }

    /* Prima foto: visibile immediatamente */
    .gallery img:first-child {
      opacity: 1;
      transition: none;
    }

    /* Le altre appaiono con un fade leggero quando entrano */
    .gallery img.visible {
      opacity: 1;
    }
  </style>

</head>
<body>

 <main class="gallery">
  <img src="photographs/foto-02.jpg" alt="Davide Albanese 1">
  <img src="photographs/foto-10.jpg" alt="Davide Albanese 2" loading="lazy">
  <img src="photographs/foto-13.jpg" alt="Davide Albanese 3" loading="lazy">
  <img src="photographs/foto-14.jpg" alt="Davide Albanese 4" loading="lazy">
  <img src="photographs/foto-15.jpg" alt="Davide Albanese 5" loading="lazy">
  <img src="photographs/foto-16.jpg" alt="Davide Albanese 6" loading="lazy">
  <img src="photographs/foto-22.jpg" alt="Davide Albanese 7" loading="lazy">
  <img src="photographs/foto-23.jpg" alt="Davide Albanese 8" loading="lazy">
  <img src="photographs/foto-27.jpg" alt="Davide Albanese 9" loading="lazy">
  <img src="photographs/foto-29.jpg" alt="Davide Albanese 10" loading="lazy">
  <img src="photographs/foto-30.jpg" alt="Davide Albanese 11" loading="lazy">
  <img src="photographs/foto-31.jpg" alt="Davide Albanese 12" loading="lazy">
 </main>

<script>
  const gallery = document.querySelector('.gallery');
  const images = Array.from(gallery.querySelectorAll('img'));

  // Shuffle
  images.sort(() => Math.random() - 0.5);
  const fragment = document.createDocumentFragment();
  images.forEach(img => fragment.appendChild(img));
  gallery.appendChild(fragment);

  // Prima foto: carica subito
  if (images[0]) {
    images[0].loading = 'eager';
    images[0].fetchPriority = 'high';
  }

  // Fade-in progressivo senza movimento
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, {
    threshold: 0.1,
    rootMargin: '50px 0px'
  });

  images.forEach((img, index) => {
    if (index !== 0) observer.observe(img);
  });
</script>

</body>
</html>
