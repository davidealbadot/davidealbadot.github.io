<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: #e8e6e1;
      color: #222;
      font-family: 'Courier New', Courier, monospace;
      padding: 60px 20px 120px;
      min-height: 100vh;
    }

    .gallery {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }

    .polaroid {
      --rot: 0deg;
      background: #fff;
      padding: 14px 14px 55px 14px;
      width: min(460px, 85vw);
      box-shadow: 0 12px 35px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08);
      opacity: 0;
      transform: rotate(var(--rot)) translateY(40px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .polaroid.visible {
      opacity: 1;
      transform: rotate(var(--rot)) translateY(0);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      filter: sepia(8%) contrast(103%);
    }

    /* Freccette */
    .nav-arrows {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      z-index: 100;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .nav-btn:hover {
      transform: scale(1.12);
      background: #fff;
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke: #333;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 600px) {
      body { padding: 40px 15px 100px; }
      .polaroid { padding: 10px 10px 40px 10px; }
      .nav-btn { width: 46px; height: 46px; }
    }
  </style>
</head>
<body>

  <main class="gallery">
    <div class="polaroid"><img src="photographs/foto-02.jpg" alt="Davide Albanese 1"></div>
    <div class="polaroid"><img src="photographs/foto-10.jpg" alt="Davide Albanese 2"></div>
    <div class="polaroid"><img src="photographs/foto-13.jpg" alt="Davide Albanese 3"></div>
    <div class="polaroid"><img src="photographs/foto-14.jpg" alt="Davide Albanese 4"></div>
    <div class="polaroid"><img src="photographs/foto-15.jpg" alt="Davide Albanese 5"></div>
    <div class="polaroid"><img src="photographs/foto-16.jpg" alt="Davide Albanese 6"></div>
    <div class="polaroid"><img src="photographs/foto-22.jpg" alt="Davide Albanese 7"></div>
    <div class="polaroid"><img src="photographs/foto-23.jpg" alt="Davide Albanese 8"></div>
    <div class="polaroid"><img src="photographs/foto-27.jpg" alt="Davide Albanese 9"></div>
    <div class="polaroid"><img src="photographs/foto-29.jpg" alt="Davide Albanese 10"></div>
    <div class="polaroid"><img src="photographs/foto-30.jpg" alt="Davide Albanese 11"></div>
    <div class="polaroid"><img src="photographs/foto-31.jpg" alt="Davide Albanese 12"></div>
  </main>

  <div class="nav-arrows">
    <button class="nav-btn" id="btn-up" aria-label="Foto precedente">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="nav-btn" id="btn-down" aria-label="Foto successiva">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
  </div>

  <script>
    const gallery = document.querySelector('.gallery');
    const polaroids = Array.from(gallery.querySelectorAll('.polaroid'));

    // Shuffle casuale
    polaroids.sort(() => Math.random() - 0.5);
    const fragment = document.createDocumentFragment();
    polaroids.forEach(p => fragment.appendChild(p));
    gallery.appendChild(fragment);

    // Rotazione casuale leggera per ogni polaroid
    polaroids.forEach(p => {
      const rot = (Math.random() - 0.5) * 5; // tra -2.5° e +2.5°
      p.style.setProperty('--rot', rot + 'deg');
    });

    // Apparizione graduale allo scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    polaroids.forEach(p => observer.observe(p));

    // Navigazione freccette
    function getCurrentIndex() {
      const center = window.scrollY + window.innerHeight / 2;
      let closest = 0;
      let minDist = Infinity;
      polaroids.forEach((p, i) => {
        const elCenter = p.offsetTop + p.offsetHeight / 2;
        const dist = Math.abs(elCenter - center);
        if (dist < minDist) {
          minDist = dist;
          closest = i;
        }
      });
      return closest;
    }

    function goTo(index) {
      if (index < 0 || index >= polaroids.length) return;
      const p = polaroids[index];
      const offset = p.offsetTop - (window.innerHeight - p.offsetHeight) / 2;
      window.scrollTo({ top: offset, behavior: 'smooth' });
    }

    document.getElementById('btn-up').addEventListener('click', () => {
      goTo(getCurrentIndex() - 1);
    });

    document.getElementById('btn-down').addEventListener('click', () => {
      goTo(getCurrentIndex() + 1);
    });

    // Anche con le frecce della tastiera
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        goTo(getCurrentIndex() - 1);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        goTo(getCurrentIndex() + 1);
      }
    });
  </script>

</body>
</html>
