<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>writing</title>

<!-- Font serif stile Claude (Source Serif 4, l'alternativa open-source più vicina a Tiempos) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..500;1,8..60,300..500&display=swap" rel="stylesheet">

<style>
  :root {
    --text-color: #1a1a1a;
    --link-color: #0151af;
    --bg-color: #ffffff;
    --max-width: 600px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header / menu minimale, come nell'originale */
  header {
    width: 100%;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header a {
    color: var(--link-color);
    text-decoration: none;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  header a:hover {
    text-decoration: underline;
  }

  /* Contenuto centrale */
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 40px 24px 60px;
  }

  .content {
    max-width: var(--max-width);
    width: 100%;
  }

  .page-title {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 32px;
  }

  /* Ogni sezione tematica: titolo + intervallo anni */
  .section {
    margin-bottom: 40px;
  }

  .section-title {
    font-weight: 600;
    font-size: 18px;
    margin-bottom: 14px;
  }

  .section-title .years {
    font-weight: 400;
  }

  /* Lista numerata di articoli */
  .article-list {
    list-style: none;
    counter-reset: item;
  }

  .article-list li {
    counter-increment: item;
    margin-bottom: 10px;
    padding-left: 28px;
    position: relative;
  }

  .article-list li::before {
    content: counter(item) ".";
    position: absolute;
    left: 0;
    color: rgba(26,26,26,0.55);
  }

  .article-list a {
    color: var(--link-color);
    text-decoration: underline;
    text-decoration-color: rgba(26,26,26,0.35);
    text-underline-offset: 2px;
  }

  .article-list a:hover {
    text-decoration-color: rgba(26,26,26,0.9);
  }

  /* Footer con link social, come l'originale */
  footer {
    width: 100%;
    padding: 24px 32px;
    text-align: center;
    font-size: 15px;
  }

  footer a {
    color: var(--link-color);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    main { padding: 32px 20px 48px; }
    header, footer { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html">Home</a>
  <span></span>
</header>

<main>
  <div class="content">

    <!-- Sezione tematica 1 -->
    <div class="section">
      <div class="section-title">“Immagina” <span class="years">(2025–)</span></div>
      <ol class="article-list">
        <li><a href="https://www.immagina.xyz/p/ascoltare-il-feedback-della-realta">Ascoltare il feedback della realtà</a></li>
        <li><a href="https://www.immagina.xyz/p/innovatori-di-loop">Innovatori di Loop</a></li>
        <li><a href="https://www.immagina.xyz/p/la-sacra-follia-tecnologica">La sacra follia tecnologica</a></li>
      </ol>
    </div>

    <!-- Sezione tematica 2 -->
    <div class="section">
      <div class="section-title">“Electrum” <span class="years">(2024–)</span></div>

   <ol class="article-list">
<li><a href="https://davalba.medium.com/computers-currencies-the-quest-for-great-design-747163ec16cc">Computers & Currencies</a></li>

<li><a href="https://davalba.medium.com/reserve-the-world-will-adapt-to-you-f10e8dc77c15">Wonders naturally attract</a></li>

      </ol>
    </div>

  </div>
</main>

</body>
</html>
