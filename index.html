<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davide Albanese</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..500;1,8..60,300..500&display=swap" rel="stylesheet">

<style>
  :root {
    --text-color: #1a1a1a;
    --link-color: #0151af;
    --bg-color: #efeee6;
    --max-width: 600px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    width: 100%;
    padding: 24px 32px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  header a {
    color: var(--link-color);
    text-decoration: none;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  header a:hover {
    text-decoration: underline;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .content {
    max-width: var(--max-width);
    width: 100%;
    text-align: center;
  }

  .avatar {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 36px;
    display: block;
    background-color: #eee;
    opacity: 0;
    transform: scale(0.96);
    animation: fadeInScale 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.05s forwards;
  }

  .bio {
    font-size: 19px;
    line-height: 1.65;
    text-align: left;
  }

  .bio p {
    margin-bottom: 22px;
    opacity: 0;
    transform: translateY(18px);
    animation: fadeUp 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  /* Stagger: ogni paragrafo appare dopo il precedente */
  .bio p:nth-child(1) { animation-delay: 0.2s; }
  .bio p:nth-child(2) { animation-delay: 0.4s; }
  .bio p:nth-child(3) { animation-delay: 0.6s; }

  .bio a {
    color: var(--link-color);
    text-decoration: underline;
    text-decoration-color: rgba(26,26,26,0.35);
    text-underline-offset: 2px;
  }

  .bio a:hover {
    text-decoration-color: rgba(26,26,26,0.9);
  }

  footer {
    width: 100%;
    padding: 24px 32px;
    text-align: center;
    font-size: 15px;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards;
  }

  footer a {
    color: var(--link-color);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeInScale {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @media (max-width: 480px) {
    .bio { font-size: 17px; }
    header, footer { padding: 20px; }
  }
</style>
</head>
<body>

<main>
  <div class="content">
    <img class="avatar" src="avatar.jpg" alt="Foto profilo">

    <div class="bio">
      <p>
        I live in Cavaion Veronese. In 2015, I started building a sports community on Instagram, which I sold in 2020 (+1.2M followers).
      </p>
      <p>
        Now I invest in people who are shaping a desirable future 🚀
      </p>
      <p>
        You can discover my <a href="/writing">writing</a>, <a href="https://x.com/davide_will/media">graphics</a> & <a href="photographs.html">photos</a>.
      </p>
    </div>
  </div>
</main>

</body>
</html>
