<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davide Albanese</title>

<!-- Font serif stile Claude (Source Serif 4, l'alternativa open-source più vicina a Tiempos) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..500;1,8..60,300..500&display=swap" rel="stylesheet">

<style>
  :root {
    --text-color: #1a1a1a;
    --link-color: #0151af;
    --bg-color: #efeee6;
    --max-width: 600px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header / menu minimale, come nell'originale */
  header {
    width: 100%;
    padding: 24px 32px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  header a {
    color: var(--link-color);
    text-decoration: none;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  header a:hover {
    text-decoration: underline;
  }

  .home-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
    transition: opacity 0.15s ease;
  }

  .home-icon:hover {
    opacity: 1;
    text-decoration: none;
  }

  /* Contenuto centrale */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .content {
    max-width: var(--max-width);
    width: 100%;
    text-align: center;
  }

  .avatar {
    width: 240px;
    height: 240px;
    border-radius: 18%;
    object-fit: cover;
    margin: 0 auto 36px;
    display: block;
    background-color: #eee;
  }

  .bio {
    font-size: 19px;
    line-height: 1.65;
    text-align: left;
  }

  .bio p {
    margin-bottom: 22px;
  }

  .bio a {
    color: var(--link-color);
    text-decoration: underline;
    text-decoration-color: rgba(26,26,26,0.35);
    text-underline-offset: 2px;
  }

  .bio a:hover {
    text-decoration-color: rgba(26,26,26,0.9);
  }

  /* Footer con link social, come l'originale */
  footer {
    width: 100%;
    padding: 24px 32px;
    text-align: center;
    font-size: 15px;
  }

  footer a {
    color: var(--link-color);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .bio { font-size: 17px; }
    header, footer { padding: 20px; }
  }
</style>
</head>
<body>


<main>
  <div class="content">
    <img class="avatar" src="avatar.jpg" alt="Foto profilo">

    <div class="bio">
      <p>
        I live in Cavaion Veronese. In 2015, I started building a sports community on Instagram, which I sold in 2020 (+1.2M followers).


      </p>
      <p>
        Now I invest in people who are shaping a desirable future 🚀
      </p>
      <p>
          You can discover my writing <a href="/writing">here</a> and my graphic design <a href="https://x.com/davide_will/media">here</a>.
      </p>
    </div>
  </div>
</main>

</body>
</html>
